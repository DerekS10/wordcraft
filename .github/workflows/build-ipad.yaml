name: Build WordCraft Unsigned (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Instalar Rust y target WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 3. Cachear compilación de Rust
        uses: Swatinem/rust-cache@v2

      - name: 4. Instalar Trunk, wasm-bindgen y wasm-opt
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen-cli,wasm-opt

      - name: 5. Compilar WordCraft a WebAssembly
        run: |
          rm -rf "$GITHUB_WORKSPACE/ios-app"
          mkdir -p "$GITHUB_WORKSPACE/ios-app/www"
          cd apps/wordcraft-web
          trunk build --release --public-url "./" --dist "$GITHUB_WORKSPACE/ios-app/www"

      - name: 6. Generar archivos de iPadOS y Proyecto Xcode
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios-app/Sources"
          cd "$GITHUB_WORKSPACE/ios-app"

          python3 -c '
          import pathlib

          project_yml = """name: WordCraft
          options:
            bundleIdPrefix: com.wordcraft
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.wordcraft.ipad
              MARKETING_VERSION: "0.11.0"
              CURRENT_PROJECT_VERSION: "1"
              TARGETED_DEVICE_FAMILY: "1,2"
              SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
              INFOPLIST_FILE: Info.plist
          targets:
            WordCraft:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: www
                  type: folder
                  buildPhase: resources
          """

          info_plist = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>es</string>
              <key>CFBundleDisplayName</key>
              <string>WordCraft</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_BUNDLE_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiresFullScreen</key>
              <false/>
              <key>UIStatusBarHidden</key>
              <true/>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UIFileSharingEnabled</key>
              <true/>
          </dict>
          </plist>
          """

          swift_code = """import SwiftUI
          import WebKit

          class LocalWasmSchemeHandler: NSObject, WKURLSchemeHandler {
              func webView(_ webView: WKWebView, start urlSchemeTask: WKURLSchemeTask) {
                  guard let url = urlSchemeTask.request.url else { return }
                  var path = url.path
                  if path.isEmpty || path == "/" {
                      path = "/index.html"
                  }
                  guard let wwwURL = Bundle.main.resourceURL?.appendingPathComponent("www") else {
                      urlSchemeTask.didFailWithError(URLError(.fileDoesNotExist))
                      return
                  }
                  let fileURL = wwwURL.appendingPathComponent(String(path.dropFirst()))
                  guard let data = try? Data(contentsOf: fileURL) else {
                      urlSchemeTask.didFailWithError(URLError(.fileDoesNotExist))
                      return
                  }
                  let ext = fileURL.pathExtension.lowercased()
                  let mimeType: String
                  switch ext {
                  case "html": mimeType = "text/html"
                  case "js":   mimeType = "application/javascript"
                  case "wasm": mimeType = "application/wasm"
                  case "css":  mimeType = "text/css"
                  case "svg":  mimeType = "image/svg+xml"
                  case "png":  mimeType = "image/png"
                  case "ttf", "otf": mimeType = "font/ttf"
                  default:     mimeType = "application/octet-stream"
                  }
                  let response = HTTPURLResponse(
                      url: url,
                      statusCode: 200,
                      httpVersion: "HTTP/1.1",
                      headerFields: [
                          "Content-Type": mimeType,
                          "Access-Control-Allow-Origin": "*",
                          "Cross-Origin-Opener-Policy": "same-origin",
                          "Cross-Origin-Embedder-Policy": "require-corp"
                      ]
                  )!
                  urlSchemeTask.didReceive(response)
                  urlSchemeTask.didReceive(data)
                  urlSchemeTask.didFinish()
              }
              func webView(_ webView: WKWebView, stop urlSchemeTask: WKURLSchemeTask) {}
          }

          struct WebViewContainer: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.setURLSchemeHandler(LocalWasmSchemeHandler(), forURLScheme: "wordcraft")
                  config.preferences.javaScriptCanOpenWindowsAutomatically = true
                  config.allowsInlineMediaPlayback = true
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.scrollView.isScrollEnabled = false
                  webView.scrollView.bounces = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  if let url = URL(string: "wordcraft://app/index.html") {
                      webView.load(URLRequest(url: url))
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct WordCraftApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebViewContainer()
                          .ignoresSafeArea(.all, edges: .all)
                          .statusBar(hidden: true)
                  }
              }
          }
          """

          import textwrap
          pathlib.Path("project.yml").write_text(textwrap.dedent(project_yml).lstrip())
          pathlib.Path("Info.plist").write_text(textwrap.dedent(info_plist).lstrip())
          pathlib.Path("Sources/WordCraftApp.swift").write_text(textwrap.dedent(swift_code).lstrip())
          '

          ls -la "$GITHUB_WORKSPACE/ios-app"
          brew install xcodegen
          xcodegen generate --spec "$GITHUB_WORKSPACE/ios-app/project.yml"

      - name: 7. Compilar App de iPadOS (Sin Firma)
        run: |
          cd "$GITHUB_WORKSPACE/ios-app"
          xcodebuild build \
            -project WordCraft.xcodeproj \
            -scheme WordCraft \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 8. Empaquetar en archivo .IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/WordCraft.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r WordCraft-iPadOS-Unsigned.ipa Payload

      - name: 9. Subir el archivo .IPA listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-iPadOS-Unsigned-IPA
          path: ${{ runner.temp }}/WordCraft-iPadOS-Unsigned.ipa
