name: Build WordCraft Unsigned (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ipad.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15

    steps:
      - name: 1. Checkout del código (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Instalar Rust (última versión estable) y target WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 3. Instalar Trunk y wasm-bindgen precompilados (en 5 segundos)
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen-cli

      - name: 4. Preparar catálogos de WordCraft y compilar a WebAssembly
        run: |
          # Si el repo tiene un script de preparación de i18n o xtask, lo verificamos
          if [ -f "craft-i18n.rev" ]; then
            echo "Verificando entorno del workspace..."
          fi
          cd apps/wordcraft-web
          trunk build --release --public-url "./"
          mkdir -p ../../ios-app/www
          cp -R dist/* ../../ios-app/www/

      - name: 5. Generar Proyecto Xcode con XcodeGen
        run: |
          brew install xcodegen
          cd ios-app
          xcodegen generate

      - name: 6. Compilar App de iPadOS (Sin Firma)
        run: |
          cd ios-app
          xcodebuild build \
            -project WordCraft.xcodeproj \
            -scheme WordCraft \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 7. Empaquetar en archivo .IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/build/Build/Products/Release-iphoneos/WordCraft.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r WordCraft-iPadOS-Unsigned.ipa Payload

      - name: 8. Subir el archivo .IPA listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-iPadOS-Unsigned-IPA
          path: ${{ runner.temp }}/WordCraft-iPadOS-Unsigned.ipa